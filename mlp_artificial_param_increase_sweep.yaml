program: ml_exp
name: mlp-artificial-param-increase-sweep
method: grid

command:
  - ${env}
  - .venv/bin/python
  - -m
  - ${program}

metric:
  name: best_val_loss
  goal: minimize

parameters:
  hidden_layer_size:
    values: [32, 64, 128, 256, 512, 1024, 2048]

  seed:
    values: [1337, 1338, 1339, 1340, 1341]

  learning_rate:
    value: 0.0006

  step_count:
    value: 10000