# Register: .venv/bin/wandb sweep --project ml-exp 'sweep yaml/transformer_v_rnn.yaml'
# Train:    .venv/bin/wandb agent <entity>/ml-exp/<sweep-id>
# Full grid: 648 runs. No early termination: every run receives the same tokens.
program: ml_exp
name: transformer-vs-rnn-matched-parameters
method: grid

command:
    - ${env}
    - .venv/bin/python
    - -m
    - ${program}

metric:
    name: best_val_loss
    goal: minimize

parameters:
    arch:
        values: [transformer, rnn]

    # Transformer width sets the parameter budget for BOTH architecture branches.
    # Embedding and MLP hidden widths are equal across each architecture pair.
    # Full-rank Transformer; head_size = n_embed / n_head.
    # RNN scales only state_size to the closest achievable parameter count.
    n_embed:
        values: [64, 128, 256, 512]
    n_head:
        value: 4
    layer_count:
        value: 6

    batch_size:
        values: [8, 16, 32]
    block_size:
        values: [48, 96, 192]
    learning_rate:
        values: [0.0001, 0.0003, 0.001]
    dropout:
        values: [0.0, 0.2, 0.4]

    seed:
        value: 1337
    weight_decay:
        value: 0.01
    # tokens = 10,000 reference steps * 16 reference batch * 48 reference block.
    # Inverse: optimizer steps = ceil(tokens / (batch_size * block_size)).
    # Corpus epochs = tokens / training_split_length; tokens = epochs * length.
    # Extra final-batch targets are masked if this inverse is not an integer.
    training_tokens:
        value: 7680000
    # 50 mid/end evaluations at the same token milestones for this grid.
    eval_every_tokens:
        value: 153600
    # Fixed tokens per split, independent of batch/block shape (incl. train-loss
    # estimation). Evaluation sampling is repeatable and separate from training.
    eval_tokens_per_split:
        value: 12288
    memory_log_interval:
        value: 10

    train_fraction:
        value: 0.9
    data_source:
        value: ./data/data.txt
    device:
        value: auto
    output_dir:
        value: ./data/training_log
