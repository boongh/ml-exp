program: ml_exp
name: mlp-rank-hidden-size-sweep
method: grid

command:
  - ${env}
  - .venv/bin/python
  - -m
  - ${program}

metric:
  name: best_val_loss
  goal: minimize

parameters:
  # 0 = baseline (full-rank MLP, no factorization)
  mlp_rank:
    values: [0, 4, 8, 16, 32, 64]

  baseline_hidden:
    values: [128, 256, 320, 384, 448, 512, 576, 640]

  seed:
    values: [1337, 1338, 1339, 1340, 1341]

  learning_rate:
    value: 0.0006

  step_count:
    value: 10000
